    <article>
      <div class="flex-parent">
        <div class="title-ansökan">
          <h1>Genomför följande instruktioner för att ansöka</h1>
        </div>
      </div>
      <div class="center">
        <form action="submit_form.php">
          <input
            type="text"
            id="full-name"
            name="full_name"
            placeholder="Fullt namn"
          />

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />

          <input
            type="tel"
            id="telefonummer"
            name="tel"
            placeholder="Telefonnummer"
          />

          <div>
            <label for="age" id="birthday">Över 18 år gammal</label>
            <input type="checkbox" id="age" required />
          </div>

          <input
            type="text"
            id="address"
            name="address"
            required
            placeholder="Address"
          />

          <label for="personligt-brev">Personligt brev</label>
          <textarea
            name="persoligt-brev"
            id="personligt-brev"
            rows="5"
            cols="50"
            required
          ></textarea>

          <label for="CV">CV</label>
          <input type="file" name="CV" id="CV" />
          <div class="flex-parent">
            <button type="submit" id="submit">Skicka in</button>
          </div>
        </form>
      </div>
    </article>
